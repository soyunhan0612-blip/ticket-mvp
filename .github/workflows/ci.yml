name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # packageManager 필드의 버전을 그대로 설치한다. setup-node의 pnpm 캐시가
      # pnpm 바이너리를 먼저 요구하므로 순서를 바꾸면 캐시 단계가 실패한다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      # 훅 스크립트는 vitest가 수집하지 않는다(include는 src/**). 여기서만 검증된다.
      - run: pnpm run test:hooks
      - run: pnpm run build
